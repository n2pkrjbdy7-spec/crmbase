<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картотека — CRM для юриста</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --ink:#18262A; --muted:#5C6B6E; --line:#D9DFDD;
  --pine:#17332E; --pine-ink:#DCE8E3; --pine-mute:#8FA8A0; --pine-active:#24463F;
  --accent:#1F6B5C; --accent-ink:#FFFFFF; --accent-soft:#DDEBE7;
  --warn:#8A5D0B; --warn-bg:#F6EAD0; --bad:#A3362A; --bad-bg:#F5DDD8; --ok:#2E6B3F;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1716; --surface:#172220; --ink:#E4ECE8; --muted:#95A59F; --line:#2A3835;
    --pine:#0B1211; --pine-active:#1A2A27;
    --accent:#4FB39D; --accent-ink:#0B1613; --accent-soft:#1E3530;
    --warn:#E0B453; --warn-bg:#3A2F16; --bad:#E68A7D; --bad-bg:#3D1F1B; --ok:#7CC48E;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#172220; --ink:#E4ECE8; --muted:#95A59F; --line:#2A3835;
  --pine:#0B1211; --pine-active:#1A2A27;
  --accent:#4FB39D; --accent-ink:#0B1613; --accent-soft:#1E3530;
  --warn:#E0B453; --warn-bg:#3A2F16; --bad:#E68A7D; --bad-bg:#3D1F1B; --ok:#7CC48E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0}

/* Боковая панель */
aside{background:var(--pine);color:var(--pine-ink);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-size:24px;font-weight:600;padding:0 10px 18px;letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;color:var(--pine-ink);text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--pine-active)}
.nav button[aria-current="page"]{background:var(--pine-active);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{font-size:12px;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto}
.side-foot button{background:none;border:1px solid var(--pine-active);color:var(--pine-mute);border-radius:6px;padding:8px 10px;width:100%;cursor:pointer;text-align:left}
.side-foot button:hover{color:var(--pine-ink)}

/* Основная область */
.wrap{padding:22px 32px 60px;max-width:1040px;width:100%}
.top{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.search{flex:1;position:relative}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2}
h2{font-family:var(--serif);font-weight:600;font-size:20px}
.sub{color:var(--muted);margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--accent-soft)}
.rc{flex:1;min-width:0;cursor:pointer}
.rt{font-weight:500;overflow-wrap:anywhere}
.rs{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;align-items:center}
.rd{text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column;flex-shrink:0}
.rd b{color:var(--ink);font-weight:500}
.rd.warn span,.rd.warn b{color:var(--warn)}
.rd.bad span,.rd.bad b{color:var(--bad)}
.row.done .rt{text-decoration:line-through;color:var(--muted)}
.row.done .rd{opacity:.6}
.tag{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:10px}
.tag.hi{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.chk{width:22px;height:22px;flex-shrink:0;border:1.5px solid var(--muted);border-radius:5px;background:none;cursor:pointer;margin-top:1px;position:relative}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"]::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}

.grp{margin-bottom:22px}
.grp h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.grp h3.bad{color:var(--bad)}
.summary{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 24px}
.summary div{display:flex;flex-direction:column}
.summary b{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.summary span{color:var(--muted);font-size:13px}
.summary .bad b{color:var(--bad)}

.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}

.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;padding:14px 16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.notes{padding:14px 16px;white-space:pre-wrap;border-top:1px solid var(--line)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px}
.crumbs{margin-bottom:10px;font-size:14px}

/* Модальное окно */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto}
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.55)}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;width:100%;max-width:520px}
.sheet h2{margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld span{font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.actions .sp{flex:1}
#err{color:var(--bad);min-height:20px;font-size:14px}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pine);color:var(--pine-ink);padding:9px 16px;border-radius:8px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

@media (max-width:820px){
  body{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:8px;overflow-x:auto}
  .brand{padding:0 10px 0 0;font-size:20px}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .side-foot{margin:0 0 0 auto}
  .wrap{padding:16px 14px 60px}
  .kv{grid-template-columns:1fr}
  h1{font-size:25px}
}
</style>
</head>
<body>
<aside>
  <div class="brand">Картотека</div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot"><button data-act="data">Данные и копия</button></div>
</aside>
<main class="wrap">
  <div class="top">
    <div class="search"><input id="q" type="search" placeholder="Поиск по клиентам, делам, срокам и задачам" aria-label="Поиск"></div>
  </div>
  <div id="main"></div>
</main>
<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script>
const KEY='kartoteka_crm_v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);

/* ---------- Даты ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>iso(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diffDays=s=>Math.round((parse(s)-parse(todayStr()))/864e5);
const sameYear=s=>parse(s).getFullYear()===new Date().getFullYear();
const fmtShort=s=>s?parse(s).toLocaleDateString('ru-RU',sameYear(s)?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'}):'';
const fmtLong=s=>parse(s).toLocaleDateString('ru-RU',sameYear(s)?{weekday:'long',day:'numeric',month:'long'}:{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function rel(s,done){
  if(!s) return {cls:'',t:'без срока'};
  const n=diffDays(s); let t;
  if(n===0)t='сегодня'; else if(n===1)t='завтра'; else if(n===-1)t='вчера';
  else if(n<0)t='просрочено на '+(-n)+' дн.'; else t='через '+n+' дн.';
  return {cls:done?'':(n<0?'bad':(n<=2?'warn':'')),t};
}

/* ---------- Данные ---------- */
let S, storageOk=true;
function blank(){return {meta:{},clients:[],cases:[],deadlines:[],tasks:[]}}
function demo(){
  const c1=uid(),c2=uid(),c3=uid(),k1=uid(),k2=uid(),k3=uid(),k4=uid();
  const cl=(id,name,kind,status,phone,email,notes,age)=>({id,name,kind,status,phone,email,notes,created:addDays(-age)});
  const ks=(id,title,clientId,type,status,court,number,responsible,fee,notes)=>({id,title,clientId,type,status,court,number,responsible,fee,notes,created:addDays(-10)});
  const dl=(caseId,title,kind,n,time,done)=>({id:uid(),caseId,title,kind,date:addDays(n),time:time||'',done:!!done,notes:''});
  const tk=(caseId,title,n,priority,assignee,done)=>({id:uid(),caseId,title,due:n===null?'':addDays(n),priority,assignee,done:!!done,notes:''});
  return {
    meta:{demo:true},
    clients:[
      cl(c1,'ООО «Северный ветер»','Юридическое лицо','Активный','+7 900 000-00-01','office@example.com','Контактное лицо — директор Орлов П. А.\nОплата по актам, ежемесячно.',60),
      cl(c2,'Иванова Мария Сергеевна','Физическое лицо','Активный','+7 900 000-00-02','','Удобнее связываться в мессенджере.',20),
      cl(c3,'ИП Кузнецов Андрей','ИП','Обращение','+7 900 000-00-03','','Пришёл по рекомендации, нужна консультация по аренде помещения.',2)
    ],
    cases:[
      ks(k1,'Взыскание задолженности по договору поставки',c1,'Судебное','В работе','Арбитражный суд','А00-0000/2026','Соколова Е.','150 000','Претензия направлена, ответа нет. Готовим исковое заявление.'),
      ks(k2,'Договор аренды склада: проверка и правки',c1,'Договорная работа','Ожидание','','','Соколова Е.','40 000','Ждём комментарии арендодателя.'),
      ks(k3,'Раздел совместно нажитого имущества',c2,'Судебное','В работе','Районный суд','2-0000/2026','Морозов Д.','90 000','Собираем документы по недвижимости и вкладам.'),
      ks(k4,'Консультация по аренде помещения',c3,'Консультация','Новое','','','Морозов Д.','5 000','')
    ],
    deadlines:[
      dl(k1,'Подать исковое заявление','Подача документа',2,'',false),
      dl(k3,'Предварительное заседание','Заседание',5,'10:30',false),
      dl(k1,'Ответ на претензию (срок по договору)','Процессуальный срок',-1,'',false),
      dl(k4,'Встреча с клиентом','Встреча',1,'15:00',false),
      dl(k2,'Получить комментарии арендодателя','Другое',9,'',false)
    ],
    tasks:[
      tk(k1,'Собрать акты сверки и накладные',0,'Высокий','Соколова Е.',false),
      tk(k3,'Запросить выписки из реестра',3,'Обычный','Морозов Д.',false),
      tk(k4,'Подготовить чек-лист вопросов по аренде',1,'Обычный','Морозов Д.',false),
      tk(k2,'Внести правки в раздел об ответственности',-2,'Высокий','Соколова Е.',false),
      tk(null,'Продлить подписку на правовую систему',null,'Низкий','',false)
    ]
  };
}
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const o=JSON.parse(r); if(o&&o.clients&&o.cases&&o.deadlines&&o.tasks){o.meta=o.meta||{};S=o;return}}
  }catch(e){storageOk=false}
  S=demo(); save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOk=false}}
const client=id=>S.clients.find(x=>x.id===id);
const kase=id=>S.cases.find(x=>x.id===id);

/* ---------- Схемы форм ---------- */
const SCHEMA={
  client:{coll:'clients',one:'клиента',fields:[
    {k:'name',l:'Имя или название',t:'text',req:1},
    {k:'kind',l:'Тип',t:'select',o:['Физическое лицо','Юридическое лицо','ИП']},
    {k:'status',l:'Статус',t:'select',o:['Обращение','Активный','Архив']},
    {k:'phone',l:'Телефон',t:'text'},
    {k:'email',l:'Email',t:'text'},
    {k:'notes',l:'Заметки',t:'textarea'}]},
  case:{coll:'cases',one:'дело',fields:[
    {k:'title',l:'Название дела',t:'text',req:1},
    {k:'clientId',l:'Клиент',t:'ref',ref:'clients',req:1},
    {k:'type',l:'Вид работы',t:'select',o:['Судебное','Консультация','Договорная работа','Регистрация','Другое']},
    {k:'status',l:'Статус',t:'select',o:['Новое','В работе','Ожидание','Завершено']},
    {k:'court',l:'Суд или орган',t:'text'},
    {k:'number',l:'Номер дела',t:'text'},
    {k:'responsible',l:'Ответственный',t:'text'},
    {k:'fee',l:'Гонорар',t:'text'},
    {k:'notes',l:'Заметки',t:'textarea'}]},
  deadline:{coll:'deadlines',one:'срок',fields:[
    {k:'title',l:'Что нужно сделать',t:'text',req:1},
    {k:'caseId',l:'Дело',t:'ref',ref:'cases',req:1},
    {k:'date',l:'Дата',t:'date',req:1},
    {k:'time',l:'Время',t:'time'},
    {k:'kind',l:'Вид срока',t:'select',o:['Заседание','Подача документа','Процессуальный срок','Встреча','Другое']},
    {k:'notes',l:'Заметки',t:'textarea'}]},
  task:{coll:'tasks',one:'задачу',fields:[
    {k:'title',l:'Задача',t:'text',req:1},
    {k:'caseId',l:'Дело',t:'ref',ref:'cases'},
    {k:'due',l:'Выполнить до',t:'date'},
    {k:'priority',l:'Приоритет',t:'select',o:['Обычный','Высокий','Низкий']},
    {k:'assignee',l:'Исполнитель',t:'text'},
    {k:'notes',l:'Заметки',t:'textarea'}]}
};
const refOptions=r=>r==='clients'?S.clients.map(c=>({id:c.id,label:c.name})):S.cases.map(c=>({id:c.id,label:c.title+(client(c.clientId)?' ('+client(c.clientId).name+')':'')}));

/* ---------- Состояние интерфейса ---------- */
let view='home', detail=null, q='';
const F={clients:'Все',cases:'Открытые',deadlines:'Предстоящие',tasks:'Открытые'};
const VIEWS=[['home','Обзор'],['clients','Клиенты'],['cases','Дела'],['deadlines','Сроки'],['tasks','Задачи']];

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),1800)}
function openModal(html){const m=$('#modal');m.innerHTML='<div class="scrim" data-act="closeModal"></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;const f=m.querySelector('input,textarea,select');if(f)f.focus()}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function ask(text,label,fn){
  openModal('<h2>'+text+'</h2><div class="actions"><span class="sp"></span><button class="btn" data-act="closeModal">Отмена</button><button class="btn danger" id="okBtn">'+label+'</button></div>');
  $('#okBtn').onclick=()=>{closeModal();fn()};
}

/* ---------- Редактор ---------- */
function openEditor(t,id,preset){
  const sc=SCHEMA[t];
  const rec=id?S[sc.coll].find(x=>x.id===id):Object.assign({},preset||{});
  if(!id&&t==='deadline'&&!rec.date) rec.date=todayStr();
  const body=sc.fields.map(f=>{
    const v=rec[f.k]==null?'':rec[f.k]; let inp;
    if(f.t==='textarea') inp='<textarea data-k="'+f.k+'" rows="3">'+esc(v)+'</textarea>';
    else if(f.t==='select') inp='<select data-k="'+f.k+'">'+f.o.map(o=>'<option '+(o===v?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    else if(f.t==='ref'){
      const opts=refOptions(f.ref);
      inp='<select data-k="'+f.k+'">'+(f.req?(opts.length?'':'<option value="">Сначала добавьте '+(f.ref==='clients'?'клиента':'дело')+'</option>'):'<option value="">Без привязки к делу</option>')+opts.map(o=>'<option value="'+o.id+'" '+(o.id===v?'selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select>';
    } else inp='<input data-k="'+f.k+'" type="'+f.t+'" value="'+esc(v)+'">';
    return '<label class="fld"><span>'+f.l+(f.req?' *':'')+'</span>'+inp+'</label>';
  }).join('');
  const title=(id?'Изменить ':'Добавить ')+(t==='client'?'клиента':t==='case'?'дело':t==='deadline'?'срок':'задачу');
  openModal('<h2>'+title+'</h2>'+body+'<div id="err"></div><div class="actions">'+(id?'<button class="btn danger" id="delBtn">Удалить</button>':'')+'<span class="sp"></span><button class="btn" data-act="closeModal">Отмена</button><button class="btn primary" id="saveBtn">Сохранить</button></div>');
  $('#saveBtn').onclick=()=>{
    const data={};
    $$('#modal [data-k]').forEach(el=>{data[el.dataset.k]=el.value.trim()});
    const bad=sc.fields.find(f=>f.req&&!data[f.k]);
    if(bad){$('#err').textContent='Заполните поле «'+bad.l+'»';return}
    if(id) Object.assign(rec,data);
    else{
      const o=Object.assign({id:uid(),created:todayStr()},data);
      if(t==='deadline'||t==='task') o.done=false;
      S[sc.coll].push(o);
    }
    save();closeModal();render();toast('Сохранено');
  };
  if(id) $('#delBtn').onclick=()=>removeItem(t,id);
}
function removeItem(t,id){
  let text='Удалить '+(t==='client'?'клиента':t==='case'?'дело':t==='deadline'?'срок':'задачу')+'?';
  if(t==='client'){const n=S.cases.filter(c=>c.clientId===id).length;if(n)text+=' Вместе с ним удалятся дела ('+n+') и их сроки и задачи.'}
  if(t==='case') text+=' Вместе с ним удалятся его сроки и задачи.';
  ask(text,'Удалить',()=>{
    if(t==='client'){S.cases.filter(c=>c.clientId===id).map(c=>c.id).forEach(cascadeCase);S.clients=S.clients.filter(x=>x.id!==id)}
    else if(t==='case') cascadeCase(id);
    else if(t==='deadline') S.deadlines=S.deadlines.filter(x=>x.id!==id);
    else S.tasks=S.tasks.filter(x=>x.id!==id);
    if(detail&&detail.id===id) detail=null;
    if(detail&&detail.t==='client'&&!client(detail.id)) detail=null;
    if(detail&&detail.t==='case'&&!kase(detail.id)) detail=null;
    save();render();toast('Удалено');
  });
}
function cascadeCase(id){
  S.deadlines=S.deadlines.filter(x=>x.caseId!==id);
  S.tasks=S.tasks.filter(x=>x.caseId!==id);
  S.cases=S.cases.filter(x=>x.id!==id);
}

/* ---------- Строки списков ---------- */
const chkBtn=(t,x)=>'<button class="chk" data-act="toggle" data-t="'+t+'" data-id="'+x.id+'" aria-pressed="'+!!x.done+'" aria-label="Отметить выполненным"></button>';
function caseLink(id){const c=kase(id);return c?'<span class="lnk" data-act="open" data-t="case" data-id="'+c.id+'">'+esc(c.title)+'</span>':''}
function rowDeadline(d,showCase){
  const r=rel(d.date,d.done);
  return '<div class="row '+(d.done?'done':'')+'">'+chkBtn('deadline',d)+
    '<div class="rc" data-act="edit" data-t="deadline" data-id="'+d.id+'"><div class="rt">'+esc(d.title)+'</div><div class="rs"><span class="tag">'+esc(d.kind)+'</span>'+(showCase!==false?caseLink(d.caseId):'')+'</div></div>'+
    '<div class="rd '+r.cls+'"><b>'+fmtShort(d.date)+(d.time?', '+esc(d.time):'')+'</b><span>'+r.t+'</span></div></div>';
}
function rowTask(x,showCase){
  const r=rel(x.due,x.done);
  return '<div class="row '+(x.done?'done':'')+'">'+chkBtn('task',x)+
    '<div class="rc" data-act="edit" data-t="task" data-id="'+x.id+'"><div class="rt">'+esc(x.title)+'</div><div class="rs">'+
    (x.priority==='Высокий'?'<span class="tag hi">Высокий приоритет</span>':'')+(x.assignee?'<span>'+esc(x.assignee)+'</span>':'')+(showCase!==false?caseLink(x.caseId):'')+'</div></div>'+
    '<div class="rd '+r.cls+'"><b>'+(x.due?fmtShort(x.due):'без срока')+'</b>'+(x.due?'<span>'+r.t+'</span>':'')+'</div></div>';
}
const dKey=d=>d.date+(d.time||'99:99');
function nextDeadline(caseId){return S.deadlines.filter(d=>d.caseId===caseId&&!d.done).sort((a,b)=>dKey(a).localeCompare(dKey(b)))[0]}
const statusTag=s=>'<span class="tag '+(s==='Завершено'||s==='Архив'?'':(s==='Ожидание'?'hi':''))+'">'+esc(s)+'</span>';
const empty=(text,btn)=>'<div class="empty">'+text+(btn?'<br>'+btn:'')+'</div>';
const chips=(key,opts)=>'<div class="chips">'+opts.map(o=>'<button class="chip" data-act="filter" data-key="'+key+'" data-v="'+o+'" aria-pressed="'+(F[key]===o)+'">'+o+'</button>').join('')+'</div>';
const pageHead=(title,sub,btnLabel,btnAct)=>'<div class="pagehead"><div><h1>'+title+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>'+(btnLabel?'<button class="btn primary" '+btnAct+'>'+btnLabel+'</button>':'')+'</div>';
function banner(){
  if(!S.meta.demo) return '';
  return '<div class="banner"><span>Сейчас показаны демонстрационные данные. Удалите их, когда будете готовы вносить свои.</span><button class="btn small" data-act="wipe">Удалить демо-данные</button><button class="btn small" data-act="hideDemo">Скрыть</button></div>';
}
const storageWarn=()=>storageOk?'':'<div class="banner"><span>Браузер не разрешает сохранять данные. Изменения пропадут после закрытия страницы. Сделайте копию через «Данные и копия».</span></div>';

/* ---------- Экраны ---------- */
function vHome(){
  const dl=S.deadlines.filter(d=>!d.done), tk=S.tasks.filter(t=>!t.done);
  const items=[].concat(dl.map(d=>({k:'d',date:d.date,time:d.time||'',o:d})),tk.filter(t=>t.due).map(t=>({k:'t',date:t.due,time:'',o:t})));
  items.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const noDue=tk.filter(t=>!t.due);
  const over=items.filter(i=>diffDays(i.date)<0).length;
  const week=items.filter(i=>{const n=diffDays(i.date);return n>=0&&n<=7}).length;
  const openCases=S.cases.filter(c=>c.status!=='Завершено').length;
  const groups=[];
  const push=(title,arr,cls)=>{if(arr.length)groups.push({title,arr,cls})};
  push('Просрочено',items.filter(i=>diffDays(i.date)<0),'bad');
  const up=items.filter(i=>{const n=diffDays(i.date);return n>=0&&n<=14});
  const by={}; up.forEach(i=>{(by[i.date]=by[i.date]||[]).push(i)});
  Object.keys(by).sort().forEach(dt=>{const n=diffDays(dt);push((n===0?'Сегодня, ':n===1?'Завтра, ':'')+fmtLong(dt),by[dt],'')});
  push('Позже',items.filter(i=>diffDays(i.date)>14),'');
  push('Задачи без срока',noDue.map(t=>({k:'t',o:t})),'');
  const rows=arr=>arr.map(i=>i.k==='d'?rowDeadline(i.o):rowTask(i.o)).join('');
  return banner()+storageWarn()+
    '<div class="pagehead"><div><h1>'+fmtLong(todayStr()).replace(/^./,c=>c.toUpperCase())+'</h1><div class="sub">Что нужно сделать в ближайшее время</div></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="add" data-t="task">Новая задача</button><button class="btn primary" data-act="add" data-t="deadline">Новый срок</button></div></div>'+
    '<div class="summary"><div class="'+(over?'bad':'')+'"><b>'+over+'</b><span>просрочено</span></div><div><b>'+week+'</b><span>на ближайшие 7 дней</span></div><div><b>'+openCases+'</b><span>открытых дел</span></div><div><b>'+S.clients.filter(c=>c.status==='Активный').length+'</b><span>активных клиентов</span></div></div>'+
    (groups.length?groups.map(g=>'<section class="grp"><h3 class="'+g.cls+'">'+g.title+'</h3><div class="panel">'+rows(g.arr)+'</div></section>').join(''):
      '<div class="panel">'+empty('Ближайших сроков и задач нет. Добавьте дату заседания или задачу по делу.','<button class="btn primary" data-act="add" data-t="deadline">Добавить срок</button>')+'</div>');
}
function vClients(){
  let list=S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  if(F.clients!=='Все') list=list.filter(c=>c.status===F.clients);
  return banner()+pageHead('Клиенты',S.clients.length+' в базе','Новый клиент','data-act="add" data-t="client"')+
    chips('clients',['Все','Обращение','Активный','Архив'])+
    '<div class="panel">'+(list.length?list.map(c=>{
      const n=S.cases.filter(k=>k.clientId===c.id).length;
      return '<div class="row click" data-act="open" data-t="client" data-id="'+c.id+'"><div class="rc"><div class="rt">'+esc(c.name)+'</div><div class="rs"><span>'+esc(c.kind)+'</span>'+(c.phone?'<span>'+esc(c.phone)+'</span>':'')+(c.email?'<span>'+esc(c.email)+'</span>':'')+'</div></div><div class="rd"><b>'+statusTag(c.status)+'</b><span>дел: '+n+'</span></div></div>';
    }).join(''):empty('Здесь пока никого нет. Добавьте первого клиента или обращение.','<button class="btn primary" data-act="add" data-t="client">Добавить клиента</button>'))+'</div>';
}
function vCases(){
  let list=S.cases.slice().sort((a,b)=>(b.created||'').localeCompare(a.created||''));
  if(F.cases==='Открытые') list=list.filter(c=>c.status!=='Завершено');
  else if(F.cases==='Завершённые') list=list.filter(c=>c.status==='Завершено');
  return banner()+pageHead('Дела',S.cases.length+' всего','Новое дело','data-act="add" data-t="case"')+
    chips('cases',['Открытые','Завершённые','Все'])+
    '<div class="panel">'+(list.length?list.map(c=>{
      const nd=nextDeadline(c.id), cl=client(c.clientId);
      return '<div class="row click" data-act="open" data-t="case" data-id="'+c.id+'"><div class="rc"><div class="rt">'+esc(c.title)+'</div><div class="rs"><span>'+esc(cl?cl.name:'Клиент удалён')+'</span>'+(c.number?'<span>'+esc(c.number)+'</span>':'')+(c.responsible?'<span>'+esc(c.responsible)+'</span>':'')+'</div></div><div class="rd '+(nd?rel(nd.date).cls:'')+'"><b>'+statusTag(c.status)+'</b><span>'+(nd?'срок '+fmtShort(nd.date):'сроков нет')+'</span></div></div>';
    }).join(''):empty('Дел пока нет. Сначала добавьте клиента, затем создайте для него дело.','<button class="btn primary" data-act="add" data-t="case">Добавить дело</button>'))+'</div>';
}
function vDeadlines(){
  let list=S.deadlines.slice().sort((a,b)=>dKey(a).localeCompare(dKey(b)));
  const f=F.deadlines;
  if(f==='Предстоящие') list=list.filter(d=>!d.done);
  else if(f==='Просроченные') list=list.filter(d=>!d.done&&diffDays(d.date)<0);
  else if(f==='Выполненные') list=list.filter(d=>d.done).reverse();
  return banner()+pageHead('Сроки','Заседания, подача документов, встречи','Новый срок','data-act="add" data-t="deadline"')+
    chips('deadlines',['Предстоящие','Просроченные','Выполненные','Все'])+
    '<div class="panel">'+(list.length?list.map(d=>rowDeadline(d)).join(''):empty('В этом списке ничего нет.','<button class="btn primary" data-act="add" data-t="deadline">Добавить срок</button>'))+'</div>';
}
function vTasks(){
  const pr={'Высокий':0,'Обычный':1,'Низкий':2};
  let list=S.tasks.slice().sort((a,b)=>((a.due||'9999')+pr[a.priority]).localeCompare((b.due||'9999')+pr[b.priority]));
  if(F.tasks==='Открытые') list=list.filter(t=>!t.done);
  else if(F.tasks==='Выполненные') list=list.filter(t=>t.done);
  return banner()+pageHead('Задачи','Внутренняя работа по делам','Новая задача','data-act="add" data-t="task"')+
    chips('tasks',['Открытые','Выполненные','Все'])+
    '<div class="panel">'+(list.length?list.map(t=>rowTask(t)).join(''):empty('В этом списке ничего нет.','<button class="btn primary" data-act="add" data-t="task">Добавить задачу</button>'))+'</div>';
}
function kv(pairs){return '<dl class="kv">'+pairs.filter(p=>p[1]).map(p=>'<dt>'+p[0]+'</dt><dd>'+esc(p[1])+'</dd>').join('')+'</dl>'}
function vClientDetail(id){
  const c=client(id); if(!c){detail=null;return vClients()}
  const cs=S.cases.filter(k=>k.clientId===id);
  return '<div class="crumbs"><span class="lnk" data-act="back">← Все клиенты</span></div>'+
    '<div class="pagehead"><div><h1>'+esc(c.name)+'</h1><div class="sub">'+esc(c.kind)+' · '+esc(c.status)+'</div></div><button class="btn" data-act="edit" data-t="client" data-id="'+id+'">Изменить</button></div>'+
    '<div class="panel">'+kv([['Телефон',c.phone],['Email',c.email],['Добавлен',c.created?fmtShort(c.created):'']])+(c.notes?'<div class="notes">'+esc(c.notes)+'</div>':'')+'</div>'+
    '<div class="sechead"><h2>Дела клиента</h2><button class="btn small primary" data-act="add" data-t="case" data-preset=\'{"clientId":"'+id+'"}\'>Добавить дело</button></div>'+
    '<div class="panel">'+(cs.length?cs.map(k=>{const nd=nextDeadline(k.id);return '<div class="row click" data-act="open" data-t="case" data-id="'+k.id+'"><div class="rc"><div class="rt">'+esc(k.title)+'</div><div class="rs">'+(k.number?'<span>'+esc(k.number)+'</span>':'')+'</div></div><div class="rd"><b>'+statusTag(k.status)+'</b><span>'+(nd?'срок '+fmtShort(nd.date):'сроков нет')+'</span></div></div>'}).join(''):empty('У этого клиента пока нет дел.'))+'</div>';
}
function vCaseDetail(id){
  const k=kase(id); if(!k){detail=null;return vCases()}
  const cl=client(k.clientId);
  const ds=S.deadlines.filter(d=>d.caseId===id).sort((a,b)=>(a.done-b.done)||dKey(a).localeCompare(dKey(b)));
  const ts=S.tasks.filter(t=>t.caseId===id).sort((a,b)=>(a.done-b.done)||((a.due||'9999').localeCompare(b.due||'9999')));
  return '<div class="crumbs"><span class="lnk" data-act="back">← Все дела</span></div>'+
    '<div class="pagehead"><div><h1>'+esc(k.title)+'</h1><div class="sub">'+esc(k.type)+' · '+esc(k.status)+'</div></div><button class="btn" data-act="edit" data-t="case" data-id="'+id+'">Изменить</button></div>'+
    '<div class="panel"><dl class="kv"><dt>Клиент</dt><dd>'+(cl?'<span class="lnk" data-act="open" data-t="client" data-id="'+cl.id+'">'+esc(cl.name)+'</span>':'—')+'</dd></dl>'+kv([['Суд или орган',k.court],['Номер дела',k.number],['Ответственный',k.responsible],['Гонорар',k.fee]])+(k.notes?'<div class="notes">'+esc(k.notes)+'</div>':'')+'</div>'+
    '<div class="sechead"><h2>Сроки</h2><button class="btn small primary" data-act="add" data-t="deadline" data-preset=\'{"caseId":"'+id+'"}\'>Добавить срок</button></div>'+
    '<div class="panel">'+(ds.length?ds.map(d=>rowDeadline(d,false)).join(''):empty('По этому делу нет сроков.'))+'</div>'+
    '<div class="sechead"><h2>Задачи</h2><button class="btn small primary" data-act="add" data-t="task" data-preset=\'{"caseId":"'+id+'"}\'>Добавить задачу</button></div>'+
    '<div class="panel">'+(ts.length?ts.map(t=>rowTask(t,false)).join(''):empty('По этому делу нет задач.'))+'</div>';
}
function vSearch(){
  const s=q.toLowerCase(), has=(...a)=>a.some(x=>String(x||'').toLowerCase().includes(s));
  const cs=S.clients.filter(c=>has(c.name,c.phone,c.email,c.notes));
  const ks=S.cases.filter(c=>has(c.title,c.number,c.court,c.responsible,c.notes));
  const ds=S.deadlines.filter(d=>has(d.title,d.kind,d.notes));
  const ts=S.tasks.filter(t=>has(t.title,t.assignee,t.notes));
  const sec=(t,arr,fn)=>arr.length?'<section class="grp"><h3>'+t+'</h3><div class="panel">'+arr.map(fn).join('')+'</div></section>':'';
  const total=cs.length+ks.length+ds.length+ts.length;
  return '<div class="pagehead"><div><h1>Поиск</h1><div class="sub">Найдено: '+total+'</div></div></div>'+
    sec('Клиенты',cs,c=>'<div class="row click" data-act="open" data-t="client" data-id="'+c.id+'"><div class="rc"><div class="rt">'+esc(c.name)+'</div><div class="rs"><span>'+esc(c.phone)+'</span></div></div></div>')+
    sec('Дела',ks,c=>'<div class="row click" data-act="open" data-t="case" data-id="'+c.id+'"><div class="rc"><div class="rt">'+esc(c.title)+'</div><div class="rs"><span>'+esc((client(c.clientId)||{}).name||'')+'</span></div></div></div>')+
    sec('Сроки',ds,d=>rowDeadline(d))+sec('Задачи',ts,t=>rowTask(t))+
    (total?'':'<div class="panel">'+empty('Ничего не найдено. Попробуйте другое слово.')+'</div>');
}

/* ---------- Отрисовка ---------- */
function render(){
  const over=S.deadlines.filter(d=>!d.done&&diffDays(d.date)<0).length;
  $('#nav').innerHTML=VIEWS.map(v=>'<button data-act="nav" data-v="'+v[0]+'" '+((view===v[0]&&!q)?'aria-current="page"':'')+'><span>'+v[1]+'</span>'+(v[0]==='deadlines'&&over?'<span class="cnt" title="Просроченные сроки">'+over+'</span>':'')+'</button>').join('');
  let html;
  if(q) html=vSearch();
  else if(detail&&detail.t==='client') html=vClientDetail(detail.id);
  else if(detail&&detail.t==='case') html=vCaseDetail(detail.id);
  else html={home:vHome,clients:vClients,cases:vCases,deadlines:vDeadlines,tasks:vTasks}[view]();
  $('#main').innerHTML=html;
  document.title='Картотека'+(over?' ('+over+')':'');
}

/* ---------- Данные и копия ---------- */
function openData(){
  openModal('<h2>Данные и копия</h2><p class="hint">Данные хранятся только в этом браузере. Чтобы сохранить копию, скопируйте текст ниже и вставьте его в любой файл. Чтобы восстановить, вставьте текст в поле и нажмите «Загрузить».</p><textarea id="dataTa" rows="8" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:monospace;font-size:12px">'+esc(JSON.stringify(S))+'</textarea><div id="err"></div><div class="actions"><button class="btn danger" data-act="wipe">Удалить все данные</button><span class="sp"></span><button class="btn" data-act="copyData">Скопировать</button><button class="btn primary" data-act="importData">Загрузить</button></div>');
}

/* ---------- События ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, t=el.dataset.t, id=el.dataset.id;
  if(a==='nav'){view=el.dataset.v;detail=null;q='';$('#q').value='';render();window.scrollTo(0,0)}
  else if(a==='open'){detail={t,id};q='';$('#q').value='';render();window.scrollTo(0,0)}
  else if(a==='back'){detail=null;render()}
  else if(a==='filter'){F[el.dataset.key]=el.dataset.v;render()}
  else if(a==='add'){openEditor(t,null,el.dataset.preset?JSON.parse(el.dataset.preset):{})}
  else if(a==='edit'){openEditor(t,id)}
  else if(a==='toggle'){const x=S[SCHEMA[t].coll].find(z=>z.id===id);if(x){x.done=!x.done;save();render()}}
  else if(a==='closeModal'){closeModal()}
  else if(a==='data'){openData()}
  else if(a==='hideDemo'){S.meta.demo=false;save();render()}
  else if(a==='wipe'){ask('Удалить все данные без возможности восстановления?','Удалить всё',()=>{S=blank();save();detail=null;render();toast('Данные удалены')})}
  else if(a==='copyData'){
    const ta=$('#dataTa');ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(err){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>toast('Скопировано'),()=>toast('Выделите текст и скопируйте вручную'));return}
    toast(ok?'Скопировано':'Выделите текст и скопируйте вручную');
  }
  else if(a==='importData'){
    try{
      const o=JSON.parse($('#dataTa').value);
      if(!(o&&Array.isArray(o.clients)&&Array.isArray(o.cases)&&Array.isArray(o.deadlines)&&Array.isArray(o.tasks))) throw 0;
      o.meta=o.meta||{};S=o;save();detail=null;closeModal();render();toast('Данные загружены');
    }catch(err){$('#err').textContent='Не удалось прочитать текст. Вставьте копию целиком, как она была скопирована.'}
  }
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

load();render();
</script>
</body>
</html>
